name: android-apk

# Builds both DSH Phone flavors on GitHub's runners (no local JDK/Android SDK
# needed) and uploads them as artifacts. Push the tag / publish the release
# yourself, or run tools/release-v0.2.x.ps1 from a machine with the APKs.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

env:
  VERSION_CODE: '15'
  VERSION_NAME: '0.2.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] || { echo "no sdkmanager under $ANDROID_SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_SDK_ROOT/build-tools/34.0.0" | head -5

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > apk/debug.keystore
            echo "keystore restored from ANDROID_KEYSTORE_BASE64"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret — a fresh keystore will be generated, so this APK cannot update an existing install"
          fi

      - name: Preflight (script syntax, patch targets, version/payload consistency)
        run: bash tools/preflight.sh

      - name: Fetch third-party assets
        run: bash tools/fetch-assets.sh

      - name: Build root APK
        run: bash tools/build-apk.sh root

      - name: Build shizuku APK
        run: bash tools/build-apk.sh shizuku

      - name: Stage release files
        run: |
          cd out-release
          sha256sum ./*.apk > "SHA256SUMS-v${VERSION_NAME}.txt"
          cat "SHA256SUMS-v${VERSION_NAME}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-phone-v${{ env.VERSION_NAME }}
          path: |
            out-release/*.apk
            out-release/SHA256SUMS-*.txt
          if-no-files-found: error

      # First run with no secret: keep this artifact, store the file as the
      # ANDROID_KEYSTORE_BASE64 secret, then delete the artifact again.
      - name: Upload freshly generated keystore
        if: ${{ hashFiles('out-release/KEYSTORE-GENERATED') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GENERATED-keystore-move-to-secret-then-delete
          path: out-release/debug.keystore
          retention-days: 1
